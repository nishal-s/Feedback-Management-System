{% extends "base.html" %}

{% block title %}MovieRev - Submit Review{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="glass-card p-5">
            <h2 class="text-center fw-bold mb-4 text-gradient">Submit Review</h2>
            
            <form method="POST" action="{{ url_for('review') }}">
                <div class="mb-4">
                    <label class="form-label fw-medium d-block">How would you rate your experience?</label>
                    <div class="d-flex justify-content-between rating-group mb-2">
                        <!-- Custom star rating mechanism (simple radio buttons styled) -->
                        {% for i in range(1, 6) %}
                        <div class="form-check form-check-inline p-0">
                            <input class="btn-check" type="radio" name="rating" id="rating{{ i }}" value="{{ i }}" required>
                            <label class="btn btn-outline-warning rounded-circle" style="width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; font-weight: bold;" for="rating{{ i }}">
                                {{ i }}
                            </label>
                        </div>
                        {% endfor %}
                    </div>
                </div>

                <div class="mb-4">
                    <label for="movie_title" class="form-label fw-medium">Movie Title</label>
                    <input type="text" class="form-control" id="movie_title" name="movie_title" required placeholder="e.g. Inception">
                </div>

                <div class="mb-4">
                    <label for="review_text" class="form-label fw-medium">Your Review</label>
                    <textarea class="form-control" id="review_text" name="review_text" rows="4" required placeholder="What did you think of the movie?"></textarea>
                </div>
                
                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-primary custom-btn btn-lg">Submit Review</button>
                    <a href="{{ url_for('index') }}" class="btn btn-outline-secondary custom-btn">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
