name: FeedOps CI/CD Pipeline

# Trigger this workflow when code is pushed to the 'main' or 'master' branch,
# or when a pull request is opened.
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run Linter (Flake8)
      run: |
        # Stop the build if there are syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings so we don't totally fail beginner code
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        
    - name: Run Unit Tests (Pytest)
      run: |
        python -m pytest tests/

  build-docker-image:
    runs-on: ubuntu-latest
    # Wait for the test job to succeed before building the Docker image
    needs: test-and-lint
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Build and Test Docker Image Locally
      run: |
        docker build -t feedops-web:latest .
        
    # Note: Pushing to DockerHub or GHCR (GitHub Container Registry) requires
    # secret environment variables. We will just test the build process for now.
